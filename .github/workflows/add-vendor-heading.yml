name: Update Eventora homepage
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove workspace section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<a href="#workspace">Workspace</a>','')
          # Remove the dark "Choose your workspace" section from the public homepage only.
          s=re.sub(r'<section class="section workspace" id="workspace">.*?</section>', '', s, count=1, flags=re.S)
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove workspace section from homepage"
          git push
